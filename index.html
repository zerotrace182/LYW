<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYW | الصفحة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        /* =========================================
           شاشة البداية (كلاسيكية وفخمة)
           ========================================= */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-in-out;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .splash-logo {
            font-size: 85px;
            font-weight: 900;
            color: #ff0000;
            letter-spacing: 12px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.6), 0 0 50px rgba(255, 0, 0, 0.3);
            margin-bottom: 40px;
            animation: fadeInLogo 1s ease-out forwards;
        }

        @keyframes fadeInLogo {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader-line {
            width: 200px; 
            height: 2px; 
            background-color: #222222;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loader-line-fill {
            width: 0%;
            height: 100%;
            background-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
            transition: width 0.05s linear;
        }

        .splash-exit {
            opacity: 0 !important;
            pointer-events: none;
        }

        /* =========================================
           شاشة الترحيب (Welcome Screen)
           ========================================= */
        #welcome-screen {
            display: none; 
            width: 100%;
            height: 100vh;
            padding: 20px;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9998;
            transition: opacity 0.6s ease;
            opacity: 0;
        }

        .welcome-card {
            background-color: #0a0a0a;
            border: 1px solid #ff0000;
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .welcome-card h1 {
            color: #ff0000;
            font-size: 45px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            margin: 0;
        }

        .welcome-card p {
            color: #cccccc;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            text-align: center;
        }

        .start-btn {
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 12px 60px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            margin-top: 10px;
        }

        .start-btn:hover {
            background-color: #cc0000;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
            transform: scale(1.05);
        }

        /* =========================================
           الصفحة الرئيسية (Main Content)
           ========================================= */
        #main-content {
            display: none; 
            width: 100%;
            min-height: 100vh;
            padding: 20px;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow-y: auto;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .main-card {
            background-color: #0a0a0a;
            border-radius: 20px;
            padding: 40px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* =========================================
           الدائرة مع الصورة
           ========================================= */
        .logo-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ff0000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            margin-bottom: 5px;
            background-color: #000; 
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        .main-title {
            font-size: 55px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888888;
            font-size: 14px;
            border: 1px solid #333333;
            border-radius: 50px;
            padding: 5px 20px;
            margin-bottom: 10px;
            background-color: #111111;
        }

        /* القائمة الصغيرة (ملاحظة البحرين) */
        .notice-box {
            width: 100%;
            background-color: #111111;
            border: 1px solid #ff0000;
            border-radius: 12px;
            padding: 12px 15px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.15);
        }

        .notice-box p {
            color: #ff4d4d;
            font-size: 15px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.5px;
        }

        /* أزرار الروابط */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            background-color: #111111;
            border: 1px solid #333333;
            border-radius: 50px;
            text-decoration: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background-color: #1a1a1a;
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .icon-svg {
            width: 24px;
            height: 24px;
            fill: #ff0000;
        }

        .footer-text {
            color: #555555;
            font-size: 14px;
            margin-top: 20px;
        }

    </style>
</head>

    <!-- =========================================
         كود الجافاسكربت
         ========================================= -->
    <script>
        // === نظام التحميل ===
        const loaderFill = document.getElementById('loaderFill');
        const splashScreen = document.getElementById('splash-screen');
        const welcomeScreen = document.getElementById('welcome-screen');
        
        // === تحميل الصورة مسبقاً (باستخدام رابط GitHub) ===
        function preloadImage() {
            return new Promise((resolve) => {
                const img = new Image();
                // ضع هنا نفس الرابط الذي وضعته في وسم img
                img.src = "ضع_رابط_الصورة_من_جيت_هاب_هنا.jpg"; 
                img.onload = resolve;
                img.onerror = resolve; 
            });
        }

        function fastLoading() {
            let progress = 0;
            
            const interval = setInterval(() => {
                progress += 3; 
                loaderFill.style.width = progress + '%';

                if (progress >= 100) {
                    clearInterval(interval);
                    
                    setTimeout(() => {
                        splashScreen.classList.add('splash-exit');
                        
                        setTimeout(() => {
                            splashScreen.style.display = 'none';
                            
                            welcomeScreen.style.display = 'flex';
                            setTimeout(() => {
                                welcomeScreen.style.opacity = '1';
                            }, 50);
                            
                        }, 600); 
                        
                    }, 100); 
                }
            }, 15); 
        }

        window.onload = function() {
            preloadImage().then(() => {
                setTimeout(fastLoading, 100);
            });
        };

        function startApp() {
            const main = document.getElementById('main-content');
            
            welcomeScreen.style.opacity = '0';
            
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                main.style.display = 'flex';
                document.body.style.overflow = 'auto';
                setTimeout(() => {
                    main.style.opacity = '1';
                }, 50);
            }, 400);
        }
    </script>
